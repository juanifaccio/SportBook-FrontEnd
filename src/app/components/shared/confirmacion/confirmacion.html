<h2 mat-dialog-title>{{ datos.titulo }}</h2>

<mat-dialog-content>
  <p>{{ datos.mensaje }}</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancelar()">
    {{ datos.textoCancelar ?? 'Cancelar' }}
  </button>
  <button mat-flat-button type="button" (click)="confirmar()">{{ datos.textoConfirmar }}</button>
</mat-dialog-actions>
