<h2 mat-dialog-title>{{ titulo }}</h2>

<mat-dialog-content>
  <app-horario-form
    [horario]="datos.horario"
    [canchas]="datos.canchas"
    [canchaPorDefecto]="datos.canchaSeleccionada"
    [guardando]="guardando()"
    (guardar)="alGuardar($event)"
    (cancelar)="alCancelar()" />
</mat-dialog-content>
